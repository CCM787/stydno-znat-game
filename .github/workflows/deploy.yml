name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pull and restart on the server
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            cd /opt/stydno-znat &&
            git pull --ff-only &&
            cd frontend && npm ci && npm run build && cd .. &&
            sudo systemctl restart stydno-znat.service
          '

      - name: Check the site is up
        run: |
          sleep 3
          curl -sf https://financeapptg.ru/game/ > /dev/null
