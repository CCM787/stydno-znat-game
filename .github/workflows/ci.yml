name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node -c server.js
          node -c db.js

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Boot smoke test
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/ > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://localhost:3000/ > /dev/null
          curl -sf http://localhost:3000/api/games > /dev/null
          curl -sf http://localhost:3000/host > /dev/null
          kill "$SERVER_PID"
